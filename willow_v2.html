<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Willow — WeCair</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --deep:   #0d1f18;
    --mid:    #1a3d2b;
    --soft:   #2e6b4f;
    --leaf:   #4a9b6f;
    --mist:   #a8c5b5;
    --amber:  #e8a838;
    --cream:  #f5f0e8;
    --shadow: rgba(0,0,0,0.4);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    width:100%; height:100%; overflow:hidden;
    background:var(--deep);
    font-family:'Jost', sans-serif;
    color:var(--cream);
    user-select:none;
  }

  /* ── BACKGROUND ────────────────────────────────────────────────────────── */
  .bg {
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse at 30% 20%, #1e4d35 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, #162b1e 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, #0f2419 0%, #080f0a 100%);
  }

  .bg-branches {
    position:fixed; inset:0; z-index:1; opacity:0.06;
    background-image:
      repeating-linear-gradient(-30deg, transparent, transparent 120px, #4a9b6f 120px, #4a9b6f 121px),
      repeating-linear-gradient(-60deg, transparent, transparent 180px, #2e6b4f 180px, #2e6b4f 181px);
  }

  /* ── ORB ───────────────────────────────────────────────────────────────── */
  .orb-wrap {
    position:fixed; inset:0; z-index:2;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }

  .orb {
    width:240px; height:240px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%,
      rgba(74,155,111,0.25) 0%, rgba(46,107,79,0.1) 40%, transparent 70%);
    border:1px solid rgba(74,155,111,0.15);
    animation: breathe 4s ease-in-out infinite;
    position:relative; transition: all 0.6s ease;
  }

  .orb.active {
    border-color: rgba(232,168,56,0.4);
    background: radial-gradient(circle at 35% 35%,
      rgba(232,168,56,0.2) 0%, rgba(74,155,111,0.1) 40%, transparent 70%);
    box-shadow: 0 0 60px rgba(232,168,56,0.15);
  }

  .orb.listening {
    border-color: rgba(232,168,56,0.7);
    animation: pulse-listen 1.2s ease-in-out infinite;
  }

  .orb.speaking {
    border-color: rgba(74,155,111,0.6);
    animation: pulse-speak 0.8s ease-in-out infinite;
  }

  .orb::before {
    content:''; position:absolute; inset:20px; border-radius:50%;
    background: radial-gradient(circle at 40% 35%, rgba(232,168,56,0.08) 0%, transparent 60%);
    animation: breathe 4s ease-in-out infinite 0.5s;
  }

  .orb::after {
    content:''; position:absolute; inset:-20px; border-radius:50%;
    border:1px solid rgba(74,155,111,0.06);
    animation: breathe 4s ease-in-out infinite 1s;
  }

  @keyframes breathe {
    0%,100% { transform:scale(1); opacity:0.6; }
    50%      { transform:scale(1.06); opacity:1; }
  }

  @keyframes pulse-listen {
    0%,100% { transform:scale(1); box-shadow:0 0 30px rgba(232,168,56,0.2); }
    50%      { transform:scale(1.1); box-shadow:0 0 60px rgba(232,168,56,0.4); }
  }

  @keyframes pulse-speak {
    0%,100% { transform:scale(1); box-shadow:0 0 30px rgba(74,155,111,0.2); }
    50%      { transform:scale(1.08); box-shadow:0 0 50px rgba(74,155,111,0.4); }
  }

  /* ── IDLE SCREEN ───────────────────────────────────────────────────────── */
  #idle-screen {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    transition:opacity 0.8s ease;
    pointer-events:none;
  }

  #idle-screen.interactive { pointer-events:all; }

  .willow-name {
    font-family:'Cormorant Garamond', serif;
    font-size:68px; font-weight:300;
    letter-spacing:0.12em;
    color:var(--cream);
    text-shadow:0 0 60px rgba(74,155,111,0.4);
    margin-bottom:8px;
    animation: fadeFloat 6s ease-in-out infinite;
  }

  .willow-name span { color:var(--amber); font-style:italic; }

  @keyframes fadeFloat {
    0%,100% { transform:translateY(0); opacity:0.9; }
    50%      { transform:translateY(-6px); opacity:1; }
  }

  .tagline {
    font-size:12px; font-weight:200;
    letter-spacing:0.25em; text-transform:uppercase;
    color:var(--mist); opacity:0.6;
    margin-bottom:50px;
  }

  .clock {
    font-family:'Cormorant Garamond', serif;
    font-size:26px; font-weight:300;
    color:var(--mist); opacity:0.5;
    letter-spacing:0.1em;
    margin-bottom:60px;
  }

  /* ── WAKE WORD HINT ────────────────────────────────────────────────────── */
  .wake-hint {
    font-size:11px; font-weight:200;
    letter-spacing:0.2em; text-transform:uppercase;
    color:var(--mist); opacity:0.35;
    margin-top:30px;
    transition: opacity 0.4s;
  }

  .wake-hint.active { opacity:0.7; color:var(--amber); }

  /* ── STATUS PILL ───────────────────────────────────────────────────────── */
  .status-pill {
    position:fixed; bottom:80px; left:50%;
    transform:translateX(-50%);
    background:rgba(46,107,79,0.15);
    border:1px solid rgba(74,155,111,0.15);
    border-radius:20px; padding:8px 20px;
    font-size:10px; font-weight:300;
    letter-spacing:0.2em; text-transform:uppercase;
    color:var(--mist); opacity:0;
    transition:all 0.4s ease; z-index:30;
    white-space:nowrap;
  }

  .status-pill.show { opacity:0.7; }
  .status-pill.alert {
    background:rgba(232,168,56,0.15);
    border-color:rgba(232,168,56,0.3);
    color:var(--amber); opacity:1;
  }

  /* ── CONVERSATION OVERLAY ──────────────────────────────────────────────── */
  #conv-overlay {
    position:fixed; inset:0; z-index:15;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end;
    padding:0 24px 140px;
    pointer-events:none;
  }

  .conversation {
    width:100%; max-width:580px;
    max-height:55vh; overflow-y:auto;
    scrollbar-width:none;
    display:flex; flex-direction:column; gap:16px;
  }
  .conversation::-webkit-scrollbar { display:none; }

  .message { animation: msgIn 0.4s ease; }

  @keyframes msgIn {
    from { opacity:0; transform:translateY(12px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .message.willow .bubble {
    background:rgba(26,61,43,0.7);
    border:1px solid rgba(74,155,111,0.2);
    border-radius:4px 18px 18px 18px;
    padding:14px 18px;
    font-size:16px; font-weight:300; line-height:1.7;
    color:var(--cream); max-width:88%;
    backdrop-filter: blur(8px);
  }

  .message.user .bubble {
    background:rgba(232,168,56,0.08);
    border:1px solid rgba(232,168,56,0.12);
    border-radius:18px 4px 18px 18px;
    padding:12px 16px;
    font-size:14px; font-weight:300; line-height:1.6;
    color:var(--mist); max-width:75%;
    margin-left:auto; text-align:right;
    backdrop-filter: blur(8px);
  }

  .msg-label {
    font-size:8px; font-weight:300;
    letter-spacing:0.2em; text-transform:uppercase;
    color:var(--mist); opacity:0.35;
    margin-bottom:5px; padding:0 4px;
  }
  .message.user .msg-label { text-align:right; }

  /* ── WAVEFORM ──────────────────────────────────────────────────────────── */
  .waveform {
    display:flex; align-items:center; gap:3px;
    height:32px; margin-top:6px;
  }

  .w-bar {
    width:3px; border-radius:2px;
    background:var(--leaf); opacity:0.6;
    animation:wave 1.2s ease-in-out infinite;
  }

  .w-bar:nth-child(1) { height:6px;  animation-delay:0s; }
  .w-bar:nth-child(2) { height:14px; animation-delay:0.1s; }
  .w-bar:nth-child(3) { height:22px; animation-delay:0.2s; }
  .w-bar:nth-child(4) { height:28px; animation-delay:0.3s; }
  .w-bar:nth-child(5) { height:22px; animation-delay:0.4s; }
  .w-bar:nth-child(6) { height:14px; animation-delay:0.5s; }
  .w-bar:nth-child(7) { height:6px;  animation-delay:0.6s; }

  @keyframes wave {
    0%,100% { transform:scaleY(1); }
    50%      { transform:scaleY(1.9); }
  }

  .waveform.hidden { display:none; }

  /* ── THINKING ──────────────────────────────────────────────────────────── */
  .thinking {
    display:flex; align-items:center; gap:5px;
    padding:10px 0;
  }

  .t-dot {
    width:4px; height:4px; border-radius:50%;
    background:var(--leaf);
    animation:think 1.4s ease-in-out infinite;
  }
  .t-dot:nth-child(2) { animation-delay:0.2s; }
  .t-dot:nth-child(3) { animation-delay:0.4s; }

  @keyframes think {
    0%,80%,100% { transform:scale(0.5); opacity:0.3; }
    40%          { transform:scale(1); opacity:1; }
  }

  .thinking.hidden { display:none; }

  /* ── BOTTOM CONTROLS ───────────────────────────────────────────────────── */
  #bottom-bar {
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    display:flex; flex-direction:column;
    align-items:center; padding-bottom:32px; gap:12px;
  }

  .end-btn {
    background:none; border:none;
    font-size:9px; font-weight:300;
    letter-spacing:0.2em; text-transform:uppercase;
    color:var(--mist); opacity:0.2;
    cursor:pointer; padding:6px 14px;
    transition:opacity 0.3s;
  }
  .end-btn:hover { opacity:0.5; }
  .end-btn.hidden { display:none; }

  /* ── RESIDENT + BRAND TAGS ─────────────────────────────────────────────── */
  .resident-tag {
    position:fixed; top:28px; right:28px; z-index:20;
    font-size:10px; font-weight:300;
    letter-spacing:0.15em; text-transform:uppercase;
    color:var(--mist); opacity:0.3;
  }

  .brand-tag {
    position:fixed; bottom:16px; left:50%;
    transform:translateX(-50%); z-index:5;
    font-size:9px; font-weight:200;
    letter-spacing:0.3em; text-transform:uppercase;
    color:var(--mist); opacity:0.18;
  }

  /* ── NOTIFICATION ──────────────────────────────────────────────────────── */
  .notif {
    position:fixed; top:28px; left:50%;
    transform:translateX(-50%);
    background:rgba(232,168,56,0.12);
    border:1px solid rgba(232,168,56,0.25);
    border-radius:8px; padding:10px 20px;
    font-size:11px; font-weight:300;
    letter-spacing:0.08em; color:var(--amber);
    z-index:50; opacity:0;
    transition:opacity 0.4s ease;
    pointer-events:none; text-align:center;
    white-space:nowrap;
  }
  .notif.show { opacity:1; }
</style>
</head>

<div class="orb-wrap"><div class="orb" id="orb"></div></div>

<!-- ── JAVASCRIPT ─────────────────────────────────────────────────────────── -->
<script>
// ── STATE ──────────────────────────────────────────────────────────────────
let history       = [];
let wakeRecog     = null;
let talkRecog     = null;
let isSpeaking    = false;
let sessionActive = false;
let currentAudio  = null;
let wakeActive    = false;

const orb       = document.getElementById('orb');
const wakeHint  = document.getElementById('wake-hint');
const endBtn    = document.getElementById('end-btn');
const thinkEl   = document.getElementById('thinking');
const waveEl    = document.getElementById('waveform');
const convEl    = document.getElementById('conversation');
const pillEl    = document.getElementById('status-pill');

// ── CLOCK ──────────────────────────────────────────────────────────────────
function tick() {
  const n = new Date();
  document.getElementById('clock').textContent =
    n.getHours().toString().padStart(2,'0') + ':' +
    n.getMinutes().toString().padStart(2,'0');
}
tick(); setInterval(tick, 15000);
document.getElementById('resident-tag').textContent = CONFIG.RESIDENT_NAME;

// ── NOTIFICATIONS ───────────────────────────────────────────────────────────
function notify(msg, duration=3000) {
  const el = document.getElementById('notif');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

function setPill(msg, alert=false) {
  pillEl.textContent = msg;
  pillEl.className = 'status-pill show' + (alert ? ' alert' : '');
  if (!msg) pillEl.className = 'status-pill';
}

// ── WAKE WORD DETECTION ─────────────────────────────────────────────────────
function startWakeWord() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { notify('Voice not supported — use Chrome'); return; }

  wakeRecog = new SR();
  wakeRecog.continuous    = true;
  wakeRecog.interimResults= true;
  wakeRecog.lang          = 'en-GB';
  wakeActive              = true;

  wakeRecog.onresult = (e) => {
    if (sessionActive || isSpeaking) return;
    let transcript = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      transcript += e.results[i][0].transcript.toLowerCase();
    }
    const heard = CONFIG.WAKE_WORDS.some(w => transcript.includes(w));
    if (heard) {
      wakeRecog.stop();
      wakeActive = false;
      activateWillow();
    }
  };

  wakeRecog.onerror = (e) => {
    if (e.error === 'not-allowed') {
      notify('Microphone permission denied. Please allow mic access.');
    }
  };

  wakeRecog.onend = () => {
    // Restart if still in wake mode and no session active
    if (wakeActive && !sessionActive) {
      setTimeout(() => {
        try { wakeRecog.start(); } catch(e) {}
      }, 300);
    }
  };

  try { wakeRecog.start(); }
  catch(e) { notify('Could not start listening'); }
}

// ── SESSION ACTIVATION ──────────────────────────────────────────────────────
async function activateWillow() {
  sessionActive = true;
  wakeHint.classList.add('active');
  wakeHint.textContent = 'Willow is here...';
  orb.classList.add('active');
  endBtn.classList.remove('hidden');

  // Send greeting
  await sendGreeting();
}

async function endSession() {
  sessionActive = false;
  history = [];
  isSpeaking = false;

  if (talkRecog)  { try { talkRecog.stop(); }  catch(e){} talkRecog = null; }
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }

  convEl.querySelectorAll('.message').forEach(m => m.remove());
  thinkEl.classList.add('hidden');
  waveEl.classList.add('hidden');

  orb.className = 'orb';
  endBtn.classList.add('hidden');
  wakeHint.textContent = 'Say "Willow" to begin';
  wakeHint.classList.remove('active');
  setPill('');

  // Restart wake word
  wakeActive = true;
  setTimeout(startWakeWord, 500);
}

// ── GREETING ────────────────────────────────────────────────────────────────
async function sendGreeting() {
  const h = new Date().getHours();
  const t = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
  await getResponse(
    `It is ${t}. ${CONFIG.RESIDENT_NAME} has just spoken your name. ` +
    `Greet her warmly and naturally. Two sentences maximum.`,
    true
  );
}

// ── LISTEN FOR SPEECH (after wake) ──────────────────────────────────────────
function listenForSpeech() {
  if (isSpeaking) return;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;

  talkRecog = new SR();
  talkRecog.continuous    = false;
  talkRecog.interimResults= false;
  talkRecog.lang          = 'en-GB';

  orb.className = 'orb listening';
  waveEl.classList.remove('hidden');
  setPill('Listening...');

  talkRecog.onresult = (e) => {
    const text = e.results[0][0].transcript;
    orb.className = 'orb active';
    waveEl.classList.add('hidden');
    setPill('');
    addMessage(text, 'user');
    getResponse(text, false);
  };

  talkRecog.onerror = (e) => {
    orb.className = 'orb active';
    waveEl.classList.add('hidden');
    setPill('');
    if (e.error === 'no-speech') {
      if (sessionActive && !isSpeaking) {
        setTimeout(listenForSpeech, 2000);
      }
    } else {
      notify('Could not hear that. Try again.');
    }
  };

  talkRecog.onend = () => {
    // If no result came through and session still active, re-listen
    if (sessionActive && !isSpeaking) {
      setTimeout(listenForSpeech, 400);
    }
  };

  try { talkRecog.start(); }
  catch(e) { notify('Microphone error'); }
}

// ── CLAUDE API ──────────────────────────────────────────────────────────────
async function getResponse(userMsg, isGreeting) {
  if (!isGreeting) {
    history.push({ role:'user', content: userMsg });
  }

  orb.className = 'orb active';
  thinkEl.classList.remove('hidden');
  setPill('Willow is thinking...');

  const messages = isGreeting
    ? [{ role:'user', content: userMsg }]
    : history;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': CONFIG.ANTHROPIC_API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model:      'claude-haiku-4-5-20251001',
        max_tokens: 300,
        system:     CONFIG.SYSTEM_PROMPT,
        messages:   messages
      })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'API error');

    const text = data.content[0].text;
    history.push({ role:'assistant', content: text });

    thinkEl.classList.add('hidden');
    addMessage(text, 'willow');
    await speak(text);

  } catch(err) {
    thinkEl.classList.add('hidden');
    setPill('');
    notify('Connection issue — check settings');
    console.error(err);
    if (sessionActive) listenForSpeech();
  }
}

// ── ELEVENLABS TTS ──────────────────────────────────────────────────────────
async function speak(text) {
  isSpeaking = true;
  orb.className = 'orb speaking';
  waveEl.classList.remove('hidden');
  setPill('Willow is speaking...');

  // Stop any active talk recognition while speaking
  if (talkRecog) { try { talkRecog.stop(); } catch(e){} talkRecog = null; }

  try {
    const res = await fetch(
      `https://api.elevenlabs.io/v1/text-to-speech/${CONFIG.ELEVENLABS_VOICE_ID}`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'xi-api-key': CONFIG.ELEVENLABS_API_KEY
        },
        body: JSON.stringify({
          text,
          model_id: 'eleven_turbo_v2',
          voice_settings: {
            stability:        0.72,
            similarity_boost: 0.88,
            style:            0.18,
            use_speaker_boost: true
          }
        })
      }
    );

    if (!res.ok) throw new Error('TTS failed');

    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    currentAudio = new Audio(url);

    currentAudio.onended = () => {
      isSpeaking = false;
      currentAudio = null;
      URL.revokeObjectURL(url);
      orb.className = 'orb active';
      waveEl.classList.add('hidden');
      setPill('');
      // Automatically listen after speaking
      if (sessionActive) listenForSpeech();
    };

    await currentAudio.play();

  } catch(err) {
    isSpeaking = false;
    orb.className = 'orb active';
    waveEl.classList.add('hidden');
    setPill('');
    console.error('TTS error:', err);
    notify('Voice error — check ElevenLabs key');
    if (sessionActive) listenForSpeech();
  }
}

// ── UI HELPERS ──────────────────────────────────────────────────────────────
function addMessage(text, sender) {
  // Remove thinking indicator temporarily, add message before it
  const msg = document.createElement('div');
  msg.className = `message ${sender}`;
  msg.innerHTML = `
    <div class="msg-label">${sender === 'willow' ? 'Willow' : CONFIG.RESIDENT_NAME}</div>
    <div class="bubble">${text}</div>
  `;
  convEl.insertBefore(msg, thinkEl);
  convEl.scrollTop = convEl.scrollHeight;
}

// ── INIT ────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  // Small delay to let browser settle before requesting mic
  setTimeout(startWakeWord, 1200);
});
</script>
